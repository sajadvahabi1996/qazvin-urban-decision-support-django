name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    name: Django checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check config webgis scripts manage.py

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend build and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend bundle
        run: npm run build

      - name: Verify generated bundle is up to date
        run: git diff --exit-code -- webgis/static/webgis/js/app.bundle.js

      - name: Check JavaScript syntax
        run: npm run check
